<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>515DAY Web Design</title>
    <link rel="shortcut icon" href="./assets/515DAY/SBSB.png" type="image/x-icon">
</head>
<style>
   *{margin:0; padding:0;}
			a{text-decoration:none;
				color:inherit;}
			img{
				display: block;
				
			}
			.fixed_box{position:fixed;
				bottom:40px;
				right:30px;
				width:40px;}
			#top img{
					width: 100%;
				}
			.home_btn, .top_btn{
				display: inline-block;
				width:55px;
				line-height: 55px;
				background-color: #1d2323;
				text-align: center;
				border-radius:50%;
				margin-bottom:5px;
				color:#fff;
				transition: all 0.5s;
			}
			.fixed_box a:hover{
				background-color: #1d2323;
			} 
</style>
<body>
   <div id="top">
			<img src="./assets/515DAY/w1.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
			<img src="./assets/515DAY/w2.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
			<img src="./assets/515DAY/w3.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
			<img src="./assets/515DAY/w4.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
			<img src="./assets/515DAY/w5.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
			<img src="./assets/515DAY/w6.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
			<img src="./assets/515DAY/w7.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
            <img src="./assets/515DAY/w8.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
            <img src="./assets/515DAY/w9.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
            <img src="./assets/515DAY/w10.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
		<div class="fixed_box">
			<a href="#" class="top_btn"><!--href부분은 이미지를 감싼 div에 있는 id이름과 동일하게 설정.-->
				TOP
			</a>
			<a href="index.html" target="_blank" class="home_btn">
				Home
			</a>
		</div>


		<!--이동시 부드럽게 이동시키기 위해 추가한 구문 시작. script쪽 전부 삭제가능.-->
		<script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
		<script>
			$(function() {
				$('a[href*="#"]:not([href="#"])').click(function() {
				if (location.pathname.replace(/^\//,'') == this.pathname.replace(/^\//,'') && location.hostname == this.hostname) {
				var target = $(this.hash);
				target = target.length ? target : $('[name=' + this.hash.slice(1) +']');
				if (target.length) {
				$('html, body').animate({
				scrollTop: target.offset().top
				}, 500);//움직이는 시간 조정
				return false;
				}
				}
				});
				});
		</script>
</body>
</html>
